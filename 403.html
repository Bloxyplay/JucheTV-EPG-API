<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 - Access Blocked</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(20, 30, 60, 0.08);
    max-width: 420px;
    width: 100%;
    padding: 48px 32px 32px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    color: #f0553d;
  }
  .code {
    font-size: 56px;
    font-weight: 800;
    color: #1b2233;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 3px;
    color: #8b93a7;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .divider {
    width: 64px;
    height: 3px;
    background: #f0a99b;
    border-radius: 2px;
    margin: 0 auto 28px;
  }
  .message {
    background: #f6f7fb;
    border-left: 3px solid #f0553d;
    border-radius: 0 12px 12px 0;
    text-align: left;
    padding: 20px 22px;
    font-size: 17px;
    line-height: 1.55;
    color: #2b3245;
    margin-bottom: 28px;
  }
  .footer {
    border-top: 1px solid #eceef3;
    padding-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
    color: #8b93a7;
  }
  .badge {
    background: #eef0f5;
    color: #4a5164;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
  }
  .dot {
    color: #c3c8d4;
  }
  .copyright {
    margin-top: 14px;
    font-size: 12px;
    color: #b0b6c4;
  }
</style>
</head>
<body>

<div class="card">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L20 5.5 V11 C20 16 16.5 19.7 12 21 C7.5 19.7 4 16 4 11 V5.5 Z"/>
    <line x1="12" y1="8.5" x2="12" y2="13"/>
    <circle cx="12" cy="16" r="0.9" fill="currentColor" stroke="none"/>
  </svg>

  <div class="code">403</div>
  <div class="subtitle">Access blocked</div>
  <div class="divider"></div>

  <div class="message">
    We're sorry, your access has been blocked because the URL you visited may pose a security threat to the website.
  </div>

  <div class="footer">
    <span class="badge">Security Protection</span>
    <span class="dot">&middot;</span>
    <span>Your visit has been recorded</span>
  </div>
  <div class="copyright">Copyright &copy; 2026 Juche TV</div>
</div>

</body>
</html>
