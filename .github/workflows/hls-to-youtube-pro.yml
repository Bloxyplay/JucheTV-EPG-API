name: Stream to YouTube

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: "HLS .m3u8 link"
        required: true
        type: string
        default: "http://60.12.124.166:1935/live/myStream1/playlist.m3u8"
      youtube_key:
        description: "YouTube stream key (empty = use secret)"
        required: false
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Stream with relay + auto-recovery (max 5h55m)
        env:
          YOUTUBE_STREAM_KEY: ${{ inputs.youtube_key || secrets.YOUTUBE_STREAM_KEY }}
          STREAM_URL: ${{ inputs.stream_url }}
        run: |
          echo "::add-mask::$YOUTUBE_STREAM_KEY"
          END=$((SECONDS + 21300))

          while [ $SECONDS -lt $END ]; do
            REMAIN=$((END - SECONDS))
            echo "Starting relay + ffmpeg, ${REMAIN}s left"

            timeout -k 5 "$REMAIN" bash -c '
              node hls-relay.js "$STREAM_URL" | ffmpeg -hide_banner -loglevel info \
                -fflags +genpts+discardcorrupt -i pipe:0 \
                -c:v copy \
                -c:a aac -b:a 128k -ar 44100 \
                -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
            ' && code=0 || code=$?

            [ "$code" -eq 124 ] && { echo "Time limit reached"; break; }

            echo "exited (code $code), restarting in 5s..."
            sleep 5
          done

          exit 0
