name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          set -e
          P=ManbangWebView
          mkdir -p $P/app/src/main/java/xyz/manbang/app $P/app/src/main/res/values $P/app/src/main/res/mipmap-nodpi $P/app/src/main/assets $P/app/src/main/res/drawable-nodpi
          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "xyz.manbang.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.juche_tv.manbang"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.wifi"
                  android:required="false" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:banner="@drawable/banner"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Manbang"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|layoutDirection"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/app/src/main/assets/NOTICE.txt <<'EOF'
          NOTICE

          This app, including its interface design, code, graphics and other original
          assets, is protected. Do not steal, reproduce, copy, modify or redistribute any
          asset from this app without written permission from Juche TV.

          Content shown inside the app is provided by third-party sites and belongs to
          its respective owners.

          (c) Juche TV
          EOF
          cat > $P/app/src/main/assets/error.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="color-scheme" content="dark light">
          <title>Manbang IPTV</title>
          <style>
            :root{
              --bg:#0b0d11; --bg-2:#10131a; --ink:#eef0f4; --muted:#8b93a3; --faint:#565e6e;
              --red:#d21f3c; --red-hi:#ff4d66; --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.05);
              --ease-spring:cubic-bezier(.22,1.4,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
            }
            @media (prefers-color-scheme: light){
              :root{ --bg:#f4f2ec; --bg-2:#eae7de; --ink:#16181d; --muted:#5d6370; --faint:#9aa0ab;
                     --line:rgba(0,0,0,.09); --chip:rgba(0,0,0,.05); }
            }
            *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
            html{ -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; overscroll-behavior:none; background:var(--bg); }
            body{
              min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
              padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
              background:radial-gradient(120% 90% at 50% -10%, var(--bg-2), var(--bg) 60%);
              color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
              -webkit-font-smoothing:antialiased; overflow:hidden; cursor:default;
              -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
            }

            .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
                    gap:26px; padding:24px; text-align:center; position:relative; }
            .bloom{ position:absolute; width:340px; height:340px; border-radius:50%;
                    background:radial-gradient(circle, rgba(210,31,60,.20), transparent 65%); filter:blur(10px);
                    opacity:.7; pointer-events:none; }

            /* icon: app logo with a status badge */
            .icon{ position:relative; z-index:1; width:96px; height:96px; flex:none;
                   animation:land .55s var(--ease-spring) both; }
            .icon .logo{ width:100%; height:100%; border-radius:24%; overflow:hidden;
                         box-shadow:0 20px 40px -16px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.3);
                         filter:saturate(.55) brightness(.9); }
            .icon .logo img{ display:block; width:100%; height:100%; object-fit:cover; }
            .badge{ position:absolute; right:-10px; bottom:-10px; width:38px; height:38px; border-radius:50%;
                    background:linear-gradient(160deg, var(--red-hi), var(--red) 55%, #8f1128);
                    border:3px solid var(--bg); color:#fff; display:flex; align-items:center; justify-content:center;
                    box-shadow:0 6px 14px -4px rgba(210,31,60,.6); }
            .badge svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
            .g-wifi, .g-alert{ display:none; }
            body.offline .g-wifi{ display:block; }
            body:not(.offline) .g-alert{ display:block; }

            .copy{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px; max-width:420px;
                   animation:fadeup .5s var(--ease-out) .12s both; }
            h1{ font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
            .msg{ font-size:14px; line-height:1.5; color:var(--muted); }
            .reason{ margin-top:4px; max-width:100%; padding:5px 11px; border-radius:999px; background:var(--chip);
                     border:1px solid var(--line); font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
                     font-size:11px; letter-spacing:.03em; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
            .reason:empty{ display:none; }

            .actions{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:12px;
                      animation:fadeup .5s var(--ease-out) .2s both; }
            button{ font:inherit; font-size:15px; font-weight:700; letter-spacing:.01em; color:#fff; border:0; cursor:pointer;
                    min-width:168px; height:48px; padding:0 28px; border-radius:14px;
                    background:linear-gradient(160deg, var(--red-hi) -10%, var(--red) 50%, #9d1229 110%);
                    box-shadow:0 14px 28px -12px rgba(210,31,60,.7), inset 0 1px 1px rgba(255,255,255,.3);
                    display:inline-flex; align-items:center; justify-content:center; gap:10px;
                    transition:transform .16s var(--ease-out), opacity .2s ease; }
            button:active{ transform:scale(.97); }
            button:focus, button:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }
            button[disabled]{ opacity:.75; cursor:default; transform:none; }
            .spin{ display:none; width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
                   border-top-color:#fff; animation:spin .8s linear infinite; }
            body.busy .spin{ display:block; }

            .hint{ min-height:18px; font-size:12px; color:var(--faint); display:flex; align-items:center; gap:7px; }
            .hint .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); animation:pulse 1.2s ease-in-out infinite; }
            .hint .dot[hidden]{ display:none; }

            @keyframes land{ from{ opacity:0; transform:scale(.6) translateY(14px); } to{ opacity:1; transform:none; } }
            @keyframes fadeup{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
            @keyframes spin{ to{ transform:rotate(360deg); } }
            @keyframes pulse{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

            /* phones held sideways (the app is landscape): side-by-side layout */
            @media (orientation:landscape) and (max-height:520px){
              .stage{ flex-direction:row; gap:40px; padding:16px 32px; text-align:left; }
              .copy{ align-items:flex-start; }
              .stack{ display:flex; flex-direction:column; gap:16px; align-items:flex-start; }
              .actions{ align-items:flex-start; }
              .bloom{ left:6%; }
            }
            .stack{ display:contents; }
            @media (orientation:landscape) and (max-height:520px){ .stack{ display:flex; } }

            @media (prefers-reduced-motion: reduce){
              .icon, .copy, .actions{ animation:none; }
              .spin, .hint .dot{ animation:none; }
            }
          </style>
          </head>
          <body class="offline" role="alert" aria-live="assertive">
            <main class="stage">
              <div class="bloom" aria-hidden="true"></div>

              <div class="icon" aria-hidden="true">
                <div class="logo"><img src="logo.png" alt=""></div>
                <div class="badge">
                  <svg class="g-wifi" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                  <svg class="g-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </div>
              </div>

              <div class="stack">
                <div class="copy">
                  <h1 id="title">No internet connection</h1>
                  <p class="msg" id="msg">Check your Wi-Fi or mobile data.</p>
                  <div class="reason" id="reason"></div>
                </div>

                <div class="actions">
                  <button id="retry" type="button"><span class="spin"></span><span id="label">Retry</span></button>
                  <div class="hint"><span class="dot" id="dot" hidden></span><span id="hint"></span></div>
                </div>
              </div>
            </main>

          <script>
            (function () {
              var body = document.body;
              var $ = function (id) { return document.getElementById(id); };
              var state = { offline: true, auto: false, reason: '', busy: false };

              function render() {
                body.classList.toggle('offline', state.offline);
                body.classList.toggle('busy', state.busy);
                $('title').textContent = state.offline ? 'No internet connection' : 'Can\u2019t reach Manbang';
                $('msg').textContent = state.offline
                  ? 'Check your Wi-Fi or mobile data. We\u2019ll reconnect as soon as you\u2019re back online.'
                  : 'The page didn\u2019t load. This is usually temporary \u2014 try again in a moment.';
                $('reason').textContent = state.reason || '';
                $('retry').disabled = state.busy;
                $('label').textContent = state.busy ? 'Retrying\u2026' : 'Retry';
                $('dot').hidden = !(state.busy || state.auto);
                $('hint').textContent = state.busy ? 'Reconnecting\u2026'
                                      : state.auto ? 'Retrying automatically\u2026'
                                      : 'Press OK or tap Retry to try again';
                if (!state.busy) { try { $('retry').focus(); } catch (e) {} }
              }

              /* called by the app */
              window.showError = function (reason, offline, auto) {
                state.reason = reason || ''; state.offline = !!offline; state.auto = !!auto; state.busy = false;
                render();
              };
              window.setRetrying = function () { state.busy = true; render(); };

              $('retry').addEventListener('click', function () {
                if (state.busy) return;
                state.busy = true; render();
                if (window.Android) Android.retry();
              });

              window.addEventListener('offline', function () { state.offline = true; render(); });
              window.addEventListener('online',  function () { state.offline = false; render(); });

              render();
            })();
          </script>
          </body>
          </html>
          EOF
          cat > $P/app/src/main/assets/loading.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="color-scheme" content="dark light">
          <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11">
          <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec">
          <title>Manbang IPTV</title>
          <style>
            :root{
              --bg:      #0b0d11;
              --bg-2:    #10131a;
              --ink:     #eef0f4;
              --muted:   #8b93a3;
              --faint:   #565e6e;
              --red:     #d21f3c;
              --red-hi:  #ff4d66;
              --line:    rgba(255,255,255,.08);
              --ease-spring: cubic-bezier(.22,1.4,.36,1);
              --ease-out:    cubic-bezier(.16,1,.3,1);
            }
            @media (prefers-color-scheme: light){
              :root{
                --bg:#f4f2ec; --bg-2:#eae7de; --ink:#16181d; --muted:#5d6370;
                --faint:#9aa0ab; --line:rgba(0,0,0,.08);
              }
            }

            *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

            html{
              -webkit-tap-highlight-color:transparent;
              -webkit-text-size-adjust:100%;
              overscroll-behavior:none;
              background:var(--bg);
            }

            body{
              min-height:100vh; min-height:100dvh;
              display:flex; flex-direction:column;
              padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
                       env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
              background:
                radial-gradient(120% 90% at 50% -10%, var(--bg-2), var(--bg) 60%);
              color:var(--ink);
              font-family:'Archivo', system-ui, -apple-system, sans-serif;
              -webkit-font-smoothing:antialiased;
              cursor:default; overflow:hidden;
              -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
            }

            /* ── Stage ── */
            .stage{
              flex:1; display:flex; flex-direction:column;
              align-items:center; justify-content:center;
              position:relative;
            }

            /* Ambient bloom behind the icon — one soft breath, not a disco */
            .bloom{
              position:absolute; width:340px; height:340px;
              border-radius:50%;
              background:radial-gradient(circle, rgba(210,31,60,.22), transparent 65%);
              filter:blur(10px);
              animation:bloom 6s ease-in-out 1.1s infinite;
              opacity:0;
            }
            @keyframes bloom{ 0%{opacity:0; transform:scale(.9);} 25%{opacity:1;} 70%,100%{opacity:.55; transform:scale(1);} }

            /* ── App icon ── */
            .icon{
              position:relative; z-index:1;
              width:104px; height:104px;
              border-radius:24%;
              background:linear-gradient(160deg, var(--red-hi) -10%, var(--red) 45%, #8f1128 110%);
              box-shadow:
                0 24px 48px -16px rgba(210,31,60,.45),
                0 4px 12px rgba(0,0,0,.35),
                inset 0 1px 1px rgba(255,255,255,.35),
                inset 0 -8px 18px rgba(0,0,0,.25);
              display:flex; align-items:center; justify-content:center;
              overflow:hidden;
              opacity:0;
              transform:scale(.55);
              animation:land .55s var(--ease-spring) .15s forwards;
            }
            .icon img{ display:block; width:100%; height:100%; border-radius:24%; object-fit:cover; }
            /* faint top-glass edge */
            .icon::after{
              content:""; position:absolute; inset:0; border-radius:24%;
              background:linear-gradient(180deg, rgba(255,255,255,.22), transparent 28%);
              pointer-events:none;
            }
            @keyframes land{
              0%  { opacity:0; transform:scale(.55) translateY(14px); }
              60% { opacity:1; }
              100%{ opacity:1; transform:scale(1) translateY(0); }
            }

            /* ── Wordmark ── */
            .brand{
              margin-top:34px;
              font-size:22px; font-weight:800;
              letter-spacing:-.02em;
              opacity:0; transform:translateY(10px);
              animation:fadeup .5s var(--ease-out) .45s forwards;
              display:flex; align-items:baseline; gap:8px;
            }
            .brand .mark{ color:var(--red); font-weight:900; }
            .brand .sub{ font-size:11px; font-weight:600; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }

            /* ── Status line: believable launcher chatter ── */
            .status{
              margin-top:14px;
              font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
              font-size:11.5px; letter-spacing:.04em;
              color:var(--muted);
              min-height:16px;
              opacity:0;
              animation:fadein .4s ease .7s forwards;
              transition:opacity .18s ease;
            }
            .status.swap{ opacity:0; }
            @keyframes fadein{ to{opacity:1;} }

            /* ── Progress ── */
            .track{
              margin-top:26px;
              width:148px; height:3px;
              border-radius:2px;
              background:var(--line);
              overflow:hidden;
              opacity:0;
              animation:fadeup .5s var(--ease-out) .55s forwards;
            }
            .bar{
              height:100%; width:0%;
              border-radius:2px;
              background:linear-gradient(90deg, var(--red), var(--red-hi));
              transition:width .45s var(--ease-out);
            }

            @keyframes fadeup{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

            /* ── Credits footer ── */
            .credits{
              padding:26px 24px calc(18px + env(safe-area-inset-bottom,0px));
              text-align:center;
              font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
              font-size:10.5px;
              line-height:2.05;
              letter-spacing:.06em;
              color:var(--faint);
              opacity:0;
              animation:fadein .6s ease .9s forwards;
            }
            .credits .row{ white-space:nowrap; }
            .credits b{ font-weight:600; color:var(--muted); }
            .credits a, .credits .url{ color:var(--muted); text-decoration:none; }
            .credits .sep{ color:var(--faint); opacity:.6; padding:0 .35em; }
            .credits .notice{ white-space:normal; max-width:560px; margin:8px auto 0; font-size:9.5px;
                              letter-spacing:.05em; line-height:1.6; text-transform:uppercase; color:var(--faint); }

            /* ── Exit: launcher hand-off zoom ── */
            .leaving .bloom{ animation:none; opacity:0; transition:opacity .2s ease; }
            .leaving .icon{
              animation:none;
              transform:scale(1.12);
              opacity:0;
              transition:transform .26s var(--ease-out), opacity .22s ease;
            }
            .leaving .brand, .leaving .status, .leaving .track, .leaving .credits{
              animation:none; opacity:0;
              transition:opacity .15s ease;
            }

            /* Short landscape screens: keep the footer on screen */
            @media (max-height:400px){
              .icon{ width:84px; height:84px; }
              .brand{ margin-top:20px; }
              .status{ margin-top:10px; }
              .track{ margin-top:16px; }
              .credits{ padding-top:12px; line-height:1.8; }
            }

            /* Reduced motion: keep it calm, keep the meaning */
            @media (prefers-reduced-motion: reduce){
              .icon{ animation:fadein .3s ease .1s forwards; transform:none; }
              .bloom{ animation:none; opacity:.4; }
              .bar{ transition:width .8s ease; }
            }
          </style>
          </head>
          <body role="status" aria-live="polite">

            <main class="stage">
              <div class="bloom" aria-hidden="true"></div>

              <div class="icon" aria-hidden="true">
                <img src="logo.png" alt="">
              </div>

              <h1 class="brand">
                <span class="mark">Manbang</span><span>IPTV</span>
                <span class="sub">TV&nbsp;Launcher</span>
              </h1>

              <div class="status" id="status">Initializing&hellip;</div>

              <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
            </main>

            <footer class="credits">
              <div class="row">COMPILED BY <b>KoryoFront</b> <span class="sep">&amp;</span> <b>JULY</b></div>
              <div class="row">REPACKAGED TO LIGHTWEIGHT APK VERSION BY <b>Juche TV</b></div>
              <div class="row url">juche-tv.vercel.app</div>
              <div class="row notice">&copy; Juche TV &mdash; do not steal, reproduce or copy any assets from this app</div>
            </footer>

          <script>
            /* ── Status chatter: short, believable boot messages ── */
            (function () {
              var el = document.getElementById('status');
              var bar = document.getElementById('bar');
              var steps = [
                ['Loading core modules',        18, 260],
                ['Fetching channel list',       44, 520],
                ['Parsing EPG data',            68, 430],
                ['Optimizing playback engine',  88, 380],
                ['Ready',                      100, 240]
              ];
              var i = 0;
              function next() {
                if (i >= steps.length) return;
                var text = steps[i][0], pct = steps[i][1], wait = steps[i][2];
                el.classList.add('swap');
                setTimeout(function () {
                  el.textContent = text + (pct < 100 ? '…' : '');
                  el.classList.remove('swap');
                  bar.style.width = pct + '%';
                  i++;
                  setTimeout(next, wait);
                }, 180);
              }
              setTimeout(next, 900);
            })();

            /* ── Hand-off: call launchDone() when the real page is ready. Waits out the
               intro so a fast load never cuts the landing animation short, then plays
               the exit zoom and fires 'launchdone' (or runs the optional callback). ── */
            (function () {
              var called = false;
              window.launchDone = function (cb) {
                if (called) return; called = true;
                setTimeout(function () {
                  document.documentElement.classList.add('leaving');
                  setTimeout(function () {
                    document.dispatchEvent(new Event('launchdone'));
                    if (typeof cb === 'function') cb();
                  }, 260);
                }, Math.max(0, 750 - performance.now()));
              };
            })();
            document.addEventListener('launchdone', function () {
              if (window.Android) Android.done();
            });
          </script>
          </body>
          </html>
