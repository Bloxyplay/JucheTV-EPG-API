                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.cancel();
                          AppLog.e("ssl", "certificate rejected " + error.getUrl());
                          onLoadFailed(error.getUrl(), "Secure connection failed");
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT));
                          keepLogOnTop();
                          AppLog.i("ui", "video fullscreen on");
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustomView();
                      }

                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          int bucket = progress / 25;
                          if (bucket > lastProgressBucket) {
                              lastProgressBucket = bucket;
                              AppLog.d("page", "progress " + Math.min(100, bucket * 25) + "%");
                          }
                      }

                      @Override
                      public boolean onConsoleMessage(ConsoleMessage m) {
                          String text = m.message() + " (" + m.sourceId() + ":" + m.lineNumber() + ")";
                          switch (m.messageLevel()) {
                              case ERROR:
                                  AppLog.e("js", text);
                                  break;
                              case WARNING:
                                  AppLog.w("js", text);
                                  break;
                              default:
                                  AppLog.d("js", text);
                                  break;
                          }
                          return true; // handled here, so the system log doesn't get the unscrubbed copy
                      }
                  });

                  if (savedInstanceState == null || web.restoreState(savedInstanceState) == null) {
                      web.loadUrl(START_URL);
                  }

                  showSplash();
              }

              private void showSplash() {
                  splash = new WebView(this);
                  splash.setBackgroundColor(0xFF0D1015);
                  splash.getSettings().setJavaScriptEnabled(true);
                  splash.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void done() {
                          ui.post(MainActivity.this::removeSplash);
                      }
                  }, "Android");
                  root.addView(splash, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  splash.loadUrl("file:///android_asset/loading.html");
                  keepLogOnTop();
                  splashShownMs = SystemClock.elapsedRealtime();
                  AppLog.d("ui", "splash shown");
                  ui.postDelayed(this::onSplashTimeout, 20000); // never get stuck on the splash
              }

              private void onSplashTimeout() {
                  unblockImages();
                  finishSplash();
              }

              private void unblockImages() {
                  web.getSettings().setBlockNetworkImage(false);
              }

              private void onLoadFailed(String url, String reason) {
                  loadFailed = true;
                  if (url != null && url.startsWith("http")) {
                      failedUrl = url;
                  }
                  unblockImages();
                  if (splash != null) {
                      splashDone = true;
                      removeSplash();
                  }
                  showErrorPage(reason);
                  ui.removeCallbacks(retryRunnable);
                  if (autoRetries < RETRY_DELAYS_MS.length) {
                      long delay = RETRY_DELAYS_MS[autoRetries++];
                      AppLog.d("net", "auto retry " + autoRetries + "/" + RETRY_DELAYS_MS.length
                              + " in " + delay + " ms");
                      ui.postDelayed(retryRunnable, delay);
                  }
              }

              private boolean isOnline() {
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null || cm.getActiveNetwork() == null) {
                          return false;
                      }
                      NetworkCapabilities nc = cm.getNetworkCapabilities(cm.getActiveNetwork());
                      return nc != null
                              && nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              && nc.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED);
                  } catch (RuntimeException e) {
                      return true;
                  }
              }

              private void showErrorPage(String reason) {
                  pendingReason = reason == null ? "" : reason;
                  pendingOffline = !isOnline();
                  pendingAuto = autoRetries < RETRY_DELAYS_MS.length;
                  AppLog.w("err", (pendingOffline ? "offline: " : "unreachable: ") + pendingReason);
                  if (errorWeb == null) {
                      errorWeb = new WebView(this);
                      errorWeb.setBackgroundColor(0xFF0D1015);
                      errorWeb.getSettings().setJavaScriptEnabled(true);
                      errorWeb.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void retry() {
                              ui.post(() -> {
                                  autoRetries = 0;
                                  retryNow();
                              });
                          }
                      }, "Android");
                      errorWeb.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              errorReady = true;
                              pushError();
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              return true; // the error page never navigates anywhere
                          }
                      });
                      root.addView(errorWeb, new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT));
                      errorWeb.loadUrl("file:///android_asset/error.html");
                  } else {
                      errorWeb.setVisibility(View.VISIBLE);
                      if (errorReady) {
                          pushError();
                      }
                  }
                  errorWeb.requestFocus();
                  keepLogOnTop();
              }

              private void pushError() {
                  errorWeb.evaluateJavascript("showError(" + JSONObject.quote(pendingReason) + ","
                          + pendingOffline + "," + pendingAuto + ")", null);
              }

              private void retryNow() {
                  ui.removeCallbacks(retryRunnable);
                  if (errorWeb != null && errorReady) {
                      errorWeb.evaluateJavascript("setRetrying()", null);
                  }
                  AppLog.i("net", "retry " + failedUrl);
                  web.loadUrl(failedUrl);
              }

              private void hideError() {
                  ui.removeCallbacks(retryRunnable);
                  autoRetries = 0;
                  if (errorWeb != null && errorWeb.getVisibility() == View.VISIBLE) {
                      errorWeb.setVisibility(View.GONE);
                      web.requestFocus();
                      AppLog.i("ui", "back online, error page hidden");
                  }
              }

              private void registerNetworkCallback() {
                  if (netCallback != null) {
                      return;
                  }
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) {
                          return;
                      }
                      netCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onLost(Network network) {
                              AppLog.w("net", "network lost");
                          }

                          @Override
                          public void onCapabilitiesChanged(Network network, NetworkCapabilities nc) {
                              String t = nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ? "wifi"
                                      : nc.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) ? "ethernet"
                                      : nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ? "cellular"
                                      : "other";
                              if (!t.equals(lastTransport)) {
                                  lastTransport = t;
                                  AppLog.i("net", "link " + t);
                              }
                          }

                          @Override
                          public void onAvailable(Network network) {
                              AppLog.i("net", "network available");
                              ui.post(() -> {
                                  if (errorWeb != null && errorWeb.getVisibility() == View.VISIBLE) {
                                      retryNow();
                                  }
                              });
                          }
                      };
                      cm.registerDefaultNetworkCallback(netCallback);
                  } catch (RuntimeException e) {
                      netCallback = null;
                  }
              }

              private void unregisterNetworkCallback() {
                  if (netCallback == null) {
                      return;
                  }
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm != null) {
                          cm.unregisterNetworkCallback(netCallback);
                      }
                  } catch (RuntimeException ignored) {
                  }
                  netCallback = null;
              }

              private void finishSplash() {
                  if (splashDone || splash == null) {
                      return;
                  }
                  splashDone = true;
                  AppLog.i("ui", "ready after " + (SystemClock.elapsedRealtime() - splashShownMs) + " ms");
                  splash.evaluateJavascript("launchDone()", null);
                  ui.postDelayed(this::removeSplash, 1500); // fallback if the exit event never arrives
              }

              private void removeSplash() {
                  if (splash == null) {
                      return;
                  }
                  root.removeView(splash);
                  splash.destroy();
                  splash = null;
                  if (errorWeb == null || errorWeb.getVisibility() != View.VISIBLE) {
                      web.requestFocus();
                  }
              }

              private void acquireWifiLock() {
                  if (wifiLock != null) {
                      return;
                  }
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext()
                              .getSystemService(Context.WIFI_SERVICE);
                      if (wm == null) {
                          return;
                      }
                      int mode = Build.VERSION.SDK_INT >= 29
                              ? WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                              : WifiManager.WIFI_MODE_FULL_HIGH_PERF;
                      wifiLock = wm.createWifiLock(mode, "manbang");
                      wifiLock.setReferenceCounted(false);
                      wifiLock.acquire();
                      AppLog.d("net", "wifi lock held");
                  } catch (RuntimeException ignored) {
                      wifiLock = null;
                  }
              }

              private void releaseWifiLock() {
                  if (wifiLock != null) {
                      try {
                          if (wifiLock.isHeld()) {
                              wifiLock.release();
                              AppLog.d("net", "wifi lock released");
                          }
                      } catch (RuntimeException ignored) {
                      }
                      wifiLock = null;
                  }
              }

              // ---------- Android TV remote ----------

              private boolean detectTv() {
                  UiModeManager um = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                  return um != null && um.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
              }

              private void injectTvNav() {
                  if (navJs == null) {
                      try (InputStream in = getAssets().open("tvnav.js")) {
                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                          }
                          navJs = out.toString("UTF-8");
                      } catch (IOException e) {
                          navJs = "";
                          AppLog.e("tv", "remote navigation script missing");
                      }
                  }
                  if (!navJs.isEmpty()) {
                      web.evaluateJavascript(navJs, null);
                  }
              }

              private void media(String cmd) {
                  web.evaluateJavascript(
                          "window.__tvnav ? __tvnav.media('" + cmd + "') : 'navigation script not ready'",
                          value -> AppLog.d("media", cmd + ": "
                                  + (value == null ? "?" : value.replace("\"", ""))));
              }

              /** Remote MENU key: press the page's own hamburger (sandwich) button. */
              private void pageMenu() {
                  if (splash != null || (errorWeb != null && errorWeb.getVisibility() == View.VISIBLE)) {
                      return;
                  }
                  web.evaluateJavascript(
                          "window.__tvnav ? __tvnav.menu() : 'navigation script not ready'",
                          value -> AppLog.i("tv", value == null ? "menu: ?" : value.replace("\"", "")));
              }

              /** OK on a text field with a remote: bring up the on-screen keyboard. */
              private void maybeShowKeyboard() {
                  if (splash != null || (errorWeb != null && errorWeb.getVisibility() == View.VISIBLE)) {
                      return;
                  }
                  web.evaluateJavascript("(function(){var a=document.activeElement;return !!(a&&"
                          + "(a.isContentEditable||a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&"
                          + "/^(text|search|url|tel|email|password|number)$/i.test(a.type||'text'))));})()",
                          value -> {
                              if ("true".equals(value)) {
                                  InputMethodManager imm =
                                          (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                                  if (imm != null) {
                                      imm.showSoftInput(web, InputMethodManager.SHOW_IMPLICIT);
                                      AppLog.d("tv", "on-screen keyboard shown");
                                  }
                              }
                          });
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent ev) {
                  if (ev.getActionMasked() == MotionEvent.ACTION_DOWN) {
                      leaveDpadMode();
                  }
                  return super.dispatchTouchEvent(ev);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent ev) {
                  int code = ev.getKeyCode();
                  boolean down = ev.getAction() == KeyEvent.ACTION_DOWN;
                  boolean first = down && ev.getRepeatCount() == 0;
                  if (down && isDpadKey(code)) {
                      enterDpadMode();
                  }
                  if (first) {
                      AppLog.d("key", KeyEvent.keyCodeToString(code).replace("KEYCODE_", ""));
                  }
                  if (first && dpadMode && customView == null
                          && (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER)) {
                      maybeShowKeyboard();
                  }
                  switch (code) {
                      case KeyEvent.KEYCODE_MENU:
                      case KeyEvent.KEYCODE_TV_CONTENTS_MENU:
                          if (first) {
                              pageMenu();
                          }
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          if (first) {
                              media("toggle");
                          }
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                          if (first) {
                              media("play");
                          }
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PAUSE:
                          if (first) {
                              media("pause");
                          }
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                          if (down) {
                              media("ff");
                          }
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                          if (down) {
                              media("rw");
                          }
                          return true;
                      default:
                          break;
                  }
                  if (customView != null) { // fullscreen video: OK = play/pause, left/right = seek
                      switch (code) {
                          case KeyEvent.KEYCODE_DPAD_CENTER:
                          case KeyEvent.KEYCODE_ENTER:
                              if (first) {
                                  media("toggle");
                              }
                              return true;
                          case KeyEvent.KEYCODE_DPAD_LEFT:
                              if (down) {
                                  media("rw");
                              }
                              return true;
                          case KeyEvent.KEYCODE_DPAD_RIGHT:
                              if (down) {
                                  media("ff");
                              }
                              return true;
                          default:
                              break;
                      }
                  }
                  return super.dispatchKeyEvent(ev);
              }

              // ---------- on-screen log (corner overlay) ----------

              private void buildLogView() {
                  float d = getResources().getDisplayMetrics().density;
                  logView = new TextView(this);
                  logView.setTypeface(Typeface.MONOSPACE);
                  logView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 9);
                  logView.setTextColor(0xFFCBD1DC);
                  logView.setPadding((int) (6 * d), (int) (4 * d), (int) (6 * d), (int) (4 * d));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xB30B0D11);
                  bg.setCornerRadius(6 * d);
                  logView.setBackground(bg);
                  logView.setClickable(false);
                  logView.setFocusable(false);
                  logView.setMaxLines(LOG_LINES);
                  logView.setMaxWidth((int) (getResources().getDisplayMetrics().widthPixels * 0.6f));
                  logView.setVisibility(logVisible ? View.VISIBLE : View.GONE);

                  // tap target that hides / shows the log
                  logToggle = new TextView(this);
                  logToggle.setTypeface(Typeface.DEFAULT_BOLD);
                  logToggle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 9);
                  logToggle.setTextColor(0xFFEEF0F4);
                  logToggle.setPadding((int) (8 * d), (int) (4 * d), (int) (8 * d), (int) (4 * d));
                  GradientDrawable chip = new GradientDrawable();
                  chip.setColor(0xB30B0D11);
                  chip.setCornerRadius(10 * d);
                  logToggle.setBackground(chip);
                  logToggle.setFocusable(false); // keep the D-pad on the page
                  logToggle.setOnClickListener(v -> toggleLog());
                  updateLogToggle();

                  logBox = new LinearLayout(this);
                  logBox.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams chipLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  chipLp.topMargin = (int) (4 * d);
                  logBox.addView(logView, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  logBox.addView(logToggle, chipLp);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.START);
                  int m = (int) (10 * d);
                  lp.setMargins(m, m, m, m);
                  root.addView(logBox, lp);
                  logBox.setVisibility(dpadMode ? View.GONE : View.VISIBLE);
              }

              private void updateLogToggle() {
                  logToggle.setText(logVisible ? "Hide log" : "Show log");
                  logToggle.setAlpha(logVisible ? 0.85f : 0.6f);
              }

              private void keepLogOnTop() {
                  if (logBox != null) {
                      logBox.bringToFront();
                  }
              }

              private void toggleLog() {
                  logVisible = !logVisible;
                  logView.setVisibility(logVisible ? View.VISIBLE : View.GONE);
                  updateLogToggle();
                  getSharedPreferences("ui", MODE_PRIVATE).edit().putBoolean("log", logVisible).apply();
                  if (logVisible) {
                      scheduleLogRefresh();
                  }
              }

              /** A remote / D-pad is in use: take the on-screen debug out (system logcat is unaffected). */
              private void enterDpadMode() {
                  if (dpadMode) {
                      return;
                  }
                  dpadMode = true;
                  AppLog.i("ui", "remote detected, on-screen debug removed");
                  AppLog.setListener(null);
                  ui.removeCallbacks(refreshLogRunnable);
                  logRefreshPending = false;
                  if (logBox != null) {
                      logBox.setVisibility(View.GONE);
                  }
              }

              /** Touch again on a phone: bring the debug option back. */
              private void leaveDpadMode() {
                  if (!dpadMode || isTv) {
                      return;
                  }
                  dpadMode = false;
                  AppLog.setListener(this::scheduleLogRefresh);
                  logBox.setVisibility(View.VISIBLE);
                  scheduleLogRefresh();
              }

              private static boolean isDpadKey(int code) {
                  return code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN
                          || code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_RIGHT
                          || code == KeyEvent.KEYCODE_DPAD_CENTER;
              }

              private void scheduleLogRefresh() {
                  if (!logRefreshPending) {
                      logRefreshPending = true;
                      ui.postDelayed(refreshLogRunnable, 120);
                  }
              }

              private void refreshLog() {
                  logRefreshPending = false;
                  if (logView == null || !logVisible || dpadMode) {
                      return;
                  }
                  List<AppLog.Entry> entries = AppLog.last(LOG_LINES);
                  SpannableStringBuilder sb = new SpannableStringBuilder();
                  for (int i = 0; i < entries.size(); i++) {
                      AppLog.Entry e = entries.get(i);
                      String msg = e.msg.length() > 56 ? e.msg.substring(0, 55) + "\u2026" : e.msg;
                      int start = sb.length();
                      sb.append(String.format(Locale.US, "%s %c %-5s %s",
                              timeFmt.format(new Date(e.time)), e.level, e.tag, msg));
                      sb.setSpan(new ForegroundColorSpan(colorFor(e.level)), start, sb.length(),
                              Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                      if (i < entries.size() - 1) {
                          sb.append('\n');
                      }
                  }
                  logView.setText(sb);
              }

              private static int colorFor(char level) {
                  switch (level) {
                      case 'E':
                          return 0xFFFF6B7D;
                      case 'W':
                          return 0xFFFFC857;
                      case 'I':
                          return 0xFF7EE0A1;
                      default:
                          return 0xFF8B93A3;
                  }
              }

              private void logStartup() {
                  AppLog.i("app", "start, device=" + (isTv ? "tv" : "phone/tablet")
                          + ", android api " + Build.VERSION.SDK_INT);
                  if (Build.VERSION.SDK_INT >= 26) {
                      PackageInfo pi = WebView.getCurrentWebViewPackage();
                      if (pi != null) {
                          AppLog.i("app", "webview " + pi.versionName);
                      }
                  }
                  AppLog.d("app", "text zoom " + TEXT_ZOOM + "%, remote navigation on");
              }

              private static boolean isInternal(Uri uri) {
                  String host = uri.getHost();
                  return "https".equals(uri.getScheme())
                          && host != null
                          && (host.equals(HOST) || host.endsWith("." + HOST));
              }

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  View v = customView;
                  WebChromeClient.CustomViewCallback cb = customViewCallback;
                  customView = null;
                  customViewCallback = null;
                  root.removeView(v);
                  web.setVisibility(View.VISIBLE);
                  web.requestFocus();
                  AppLog.i("ui", "video fullscreen off");
                  if (cb != null) {
                      cb.onCustomViewHidden();
                  }
              }

              private void hideSystemUi() {
                  Window w = getWindow();
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(
                                  WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      w.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      hideCustomView();
                  } else if (errorWeb != null && errorWeb.getVisibility() == View.VISIBLE) {
                      super.onBackPressed();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  AppLog.d("app", "pause");
                  releaseWifiLock();
                  unregisterNetworkCallback();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  AppLog.d("app", "resume");
                  web.onResume();
                  acquireWifiLock();
                  registerNetworkCallback();
              }

              @Override
              protected void onDestroy() {
                  AppLog.setListener(null);
                  ui.removeCallbacksAndMessages(null);
                  root.removeAllViews();
                  if (splash != null) {
                      splash.destroy();
                      splash = null;
                  }
                  if (errorWeb != null) {
                      errorWeb.destroy();
                      errorWeb = null;
                  }
                  web.destroy();
                  super.onDestroy();
              }
          }
