      - name: Decrypt protected sources
        env:
          SITE_KEY: ${{ secrets.SITE_KEY }}
        run: |
          set -e
          if [ -z "$SITE_KEY" ]; then
            echo "::error::Repo secret SITE_KEY is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          P=ManbangWebView
          base64 -d <<'EOF' | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt 3<<<"$SITE_KEY" > $P/app/src/main/java/xyz/manbang/app/Site.java
          jA0ECQMK3ufoOo/+QPf/0rgB33UZ3wlzqzK1Iq2yKcUiPZ9T1Lgr6W9nnsWrEwUx8MaejzNR9pw6
          aV9oBjy35aT4TjIf4ZOCCNT93DUfV6OC2RW0er+cl+ZvnVCgq2+6qvbwkSGMZH8QueXORuxJ8N6t
          a0wFUG8/nzap/beUH2FI02BLysXrtN6c0T5fhhVto6fbNRZ3q23d4WQ/CGj/hZv+k3n0ZsG5qya4
          veW/Tj7h8tcrI6OR3dgLnUiK35wXEg4jMlXP37Gv
          EOF
          test -s $P/app/src/main/java/xyz/manbang/app/Site.java

      - name: Build
        working-directory: ManbangWebView
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: manbang-apk
          path: ManbangWebView/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ManbangWebView/app/build/outputs/apk/debug/app-debug.apk manbang.apk
          gh release delete latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest manbang.apk --repo "$GITHUB_REPOSITORY" --title "latest" --notes "Debug build ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
