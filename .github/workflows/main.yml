name: Download & Restream to OK.ru

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct video download URL'
        required: true
        type: string

      okru_stream_key:
        description: 'OK.ru Broadcast Key'
        required: true
        type: string

      quality:
        description: 'Stream quality'
        required: true
        type: choice
        options:
          - '1080p'
          - '720p'
          - '480p'
        default: '720p'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Video
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          echo "::add-mask::$DOWNLOAD_URL"

          curl -fL --retry 5 --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 0 \
            -o video.mp4 "$DOWNLOAD_URL"

          if [ ! -s video.mp4 ]; then
            echo "Download failed or file is empty."
            exit 1
          fi

          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 video.mp4

      - name: Stream to OK.ru
        env:
          OKRU_KEY: ${{ inputs.okru_stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          echo "::add-mask::$OKRU_KEY"

          SERVER="rtmp://vsu.okcdn.ru/input/"
          OK_URL="${SERVER}${OKRU_KEY}"

          case "$QUALITY" in
            1080p)
              SCALE="1920:1080"
              VBR="6000k"
              BUFR="12000k"
              ABR="160k"
              ;;
            720p)
              SCALE="1280:720"
              VBR="4500k"
              BUFR="9000k"
              ABR="160k"
              ;;
            480p)
              SCALE="854:480"
              VBR="2000k"
              BUFR="4000k"
              ABR="128k"
              ;;
          esac

          attempt=0

          while true; do
            attempt=$((attempt + 1))
            echo "=== Stream attempt #${attempt} ==="

            ffmpeg -hide_banner -loglevel warning \
              -stream_loop -1 \
              -re \
              -i video.mp4 \
              -vf "scale=${SCALE}:force_original_aspect_ratio=decrease,pad=${SCALE}:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 \
              -preset veryfast \
              -b:v "$VBR" \
              -maxrate "$VBR" \
              -bufsize "$BUFR" \
              -g 60 \
              -keyint_min 60 \
              -sc_threshold 0 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a "$ABR" \
              -ac 2 \
              -ar 44100 \
              -map 0:v:0 \
              -map 0:a:0? \
              -f flv "$OK_URL" \
              && break

            echo "Stream disconnected. Restarting in 5 seconds..."
            sleep 5
          done
