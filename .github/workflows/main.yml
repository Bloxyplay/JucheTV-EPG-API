name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project
        run: |
          set -e
          P=ManbangWebView
          mkdir -p $P/app/src/main/java/xyz/manbang/app $P/app/src/main/res/values $P/app/src/main/res/mipmap-nodpi $P/app/src/main/assets
          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "xyz.manbang.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "xyz.manbang.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Manbang"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|layoutDirection"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/app/src/main/assets/loading.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="color-scheme" content="light dark">
          <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6">
          <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1015">
          <title>Launching Manbang IPTV</title>
          <style>
            :root {
              --bg:        #faf9f6;
              --ink:       #16181d;
              --muted:     #5d6370;
              --track:     #e7e3da;
              --red:       #c8102e;
              --red-dark:  #9d0c25;
              --ease-out:  cubic-bezier(0.23, 1, 0.32, 1);
              --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
              --beat:      2.8s;   /* ring + sheen fire together; bar loops twice per beat */
            }
            @media (prefers-color-scheme: dark) {
              :root { --bg:#0d1015; --ink:#ffffff; --muted:#aab1bf; --track:#262c36; }
            }

            *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

            html {
              -webkit-tap-highlight-color: transparent;
              -webkit-text-size-adjust: 100%;
              overscroll-behavior: none;
              background: var(--bg);
            }

            body {
              min-height: 100vh;
              min-height: 100dvh;
              display: flex; flex-direction: column; align-items: center; justify-content: center;
              padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                       env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
              background: var(--bg);
              color: var(--ink);
              font-family: 'Archivo', system-ui, -apple-system, sans-serif;
              -webkit-font-smoothing: antialiased;
              cursor: default;
              -webkit-user-select: none; user-select: none;
              -webkit-touch-callout: none;
              overflow: hidden;
            }

            /* ── App icon ── */
            .icon {
              position: relative;
              width: 96px; height: 96px;
              margin-bottom: 36px;
              animation: pop .4s var(--ease-out) both;
            }
            .icon-body {
              position: relative; z-index: 1;
              width: 100%; height: 100%;
              border-radius: 22.5%;                       /* iOS-style squircle proportion */
              background: linear-gradient(150deg, var(--red), var(--red-dark));
              box-shadow: 0 14px 30px -10px rgba(0,0,0,.45),
                          inset 0 1px 0 rgba(255,255,255,.28);  /* light catching the top edge */
              display: flex; align-items: center; justify-content: center;
              overflow: hidden;
            }
            .icon-body img { display: block; width: 100%; height: 100%; border-radius: 22.5%; }

            /* Sheen: a soft highlight sweeping across the glass, once per beat */
            .icon-body::after {
              content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 60%;
              background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.34) 50%, transparent 80%);
              transform: translateX(-120%) skewX(-12deg);
              pointer-events: none;
              animation: sheen var(--beat) var(--ease-in-out) .9s infinite;
            }

            /* Soft beacon ring, same idea as the live dot on the site */
            .icon::before {
              content: ""; position: absolute; inset: 0;
              border-radius: 22.5%;
              background: var(--red);
              opacity: 0;
              animation: ring var(--beat) var(--ease-out) .9s infinite;
            }

            /* ── Label ── */
            .label {
              font-size: 19px; font-weight: 600;
              letter-spacing: -0.01em; line-height: 1.2;
              text-align: center;
              animation: rise .4s var(--ease-out) .08s both;
            }
            .label em { font-style: normal; font-weight: 900; color: var(--red); }

            /* ── Progress ── */
            .track {
              width: 120px; height: 4px; margin-top: 22px;
              border-radius: 2px; background: var(--track);
              overflow: hidden;
              animation: rise .4s var(--ease-out) .16s both;
            }
            .bar {
              width: 45%; height: 100%;
              border-radius: 2px; background: var(--red);
              animation: slide 1.4s var(--ease-in-out) .16s infinite backwards;
              will-change: transform;
            }

            @keyframes pop   { from { opacity:0; transform: scale(.92); } to { opacity:1; transform: none; } }
            @keyframes rise  { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
            @keyframes ring  { 0% { opacity:.32; transform: scale(1); } 100% { opacity:0; transform: scale(1.5); } }
            @keyframes sheen { 0% { transform: translateX(-120%) skewX(-12deg); } 40%, 100% { transform: translateX(260%) skewX(-12deg); } }
            @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(222%); } }

            /* Exit: launch zoom. Icon swells and fades, text drops out first. */
            .leaving .icon {
              animation: none;
              opacity: 0; transform: scale(1.06);
              transition: opacity .22s var(--ease-out), transform .22s var(--ease-out);
            }
            .leaving .label, .leaving .track {
              animation: none; opacity: 0;
              transition: opacity .16s var(--ease-out);
            }

            /* Reduced motion: keep the fades, drop movement */
            @media (prefers-reduced-motion: reduce) {
              .icon, .label, .track { animation: fade .3s ease both; }
              .icon::before, .icon-body::after { animation: none; }
              .leaving .icon { transform: none; }
              .bar { width: 100%; animation: breathe 1.6s ease-in-out infinite; will-change: auto; }
              @keyframes fade    { from { opacity:0; } to { opacity:1; } }
              @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:1; } }
            }
          </style>
          </head>
          <body role="status" aria-live="polite">

            <div class="icon" aria-hidden="true">
              <div class="icon-body">
                <img src="logo.png" alt="">
              </div>
            </div>

            <h1 class="label">Launching <em>Manbang IPTV</em></h1>

            <div class="track" aria-hidden="true"><div class="bar"></div></div>

          <script>
            /* Hand-off: call launchDone() when the real page is ready. It waits out the
               intro so a fast load never cuts the pop mid-flight, then plays the exit and
               fires a 'launchdone' event (or runs the optional callback). */
            (function () {
              var called = false;
              window.launchDone = function (cb) {
                if (called) return; called = true;
                setTimeout(function () {
                  document.documentElement.classList.add('leaving');
                  setTimeout(function () {
                    document.dispatchEvent(new Event('launchdone'));
                    if (typeof cb === 'function') cb();
                  }, 240);
                }, Math.max(0, 700 - performance.now()));
              };
            })();
            document.addEventListener('launchdone', function () {
              if (window.Android) Android.done();
            });
          </script>
          </body>
          </html>
          EOF
          cat > $P/app/src/main/java/xyz/manbang/app/MainActivity.java <<'EOF'
          package xyz.manbang.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Build;
          import android.net.wifi.WifiManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final String START_URL = "https://manbang.xyz/";
              private static final String HOST = "manbang.xyz";
              private static final int TEXT_ZOOM = 85; // % of normal text size; lower = smaller
              private static final long[] RETRY_DELAYS_MS = {2000, 5000}; // automatic retries before waiting for the button

              private FrameLayout root;
              private WebView web;
              private WebView splash;
              private boolean splashDone;
              private LinearLayout errorView;
              private TextView errorText;
              private boolean loadFailed;
              private int autoRetries;
              private String failedUrl = START_URL;
              private ConnectivityManager.NetworkCallback netCallback;
              private final Runnable retryRunnable = this::retryNow;
              private WifiManager.WifiLock wifiLock;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  root.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setTextZoom(TEXT_ZOOM);
                  s.setBlockNetworkImage(true); // page first, images right after it finishes
                  if (Build.VERSION.SDK_INT >= 26) {
                      s.setSafeBrowsingEnabled(false); // skips the per-navigation lookup
                      web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, true);
                  }

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (isInternal(uri)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException ignored) {
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          loadFailed = false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (!loadFailed) {
                              hideError();
                              unblockImages();
                              finishSplash();
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request.isForMainFrame()) {
                              onLoadFailed(request.getUrl().toString(), error.getDescription().toString());
                          }
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request,
                                                      WebResourceResponse errorResponse) {
                          if (request.isForMainFrame() && errorResponse.getStatusCode() >= 500) {
                              onLoadFailed(request.getUrl().toString(),
                                      "Server error " + errorResponse.getStatusCode());
                          }
                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.cancel();
                          onLoadFailed(error.getUrl(), "Secure connection failed");
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT));
                      }

                      @Override
                      public void onHideCustomView() {
                          hideCustomView();
                      }
                  });

                  if (savedInstanceState == null || web.restoreState(savedInstanceState) == null) {
                      web.loadUrl(START_URL);
                  }

                  buildErrorView();
                  showSplash();
              }

              private void showSplash() {
                  splash = new WebView(this);
                  splash.setBackgroundColor(0xFF0D1015);
                  splash.getSettings().setJavaScriptEnabled(true);
                  splash.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void done() {
                          ui.post(MainActivity.this::removeSplash);
                      }
                  }, "Android");
                  root.addView(splash, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
                  splash.loadUrl("file:///android_asset/loading.html");
                  ui.postDelayed(this::onSplashTimeout, 20000); // never get stuck on the splash
              }

              private void onSplashTimeout() {
                  unblockImages();
                  finishSplash();
              }

              private void unblockImages() {
                  web.getSettings().setBlockNetworkImage(false);
              }

              private void buildErrorView() {
                  float d = getResources().getDisplayMetrics().density;
                  int pad = (int) (24 * d);

                  errorView = new LinearLayout(this);
                  errorView.setOrientation(LinearLayout.VERTICAL);
                  errorView.setGravity(Gravity.CENTER);
                  errorView.setBackgroundColor(0xFF0D1015);
                  errorView.setPadding(pad, pad, pad, pad);
                  errorView.setClickable(true);
                  errorView.setVisibility(View.GONE);

                  TextView title = new TextView(this);
                  title.setText("Can\u2019t load Manbang");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);

                  errorText = new TextView(this);
                  errorText.setTextColor(0xFFAAB1BF);
                  errorText.setTextSize(14);
                  errorText.setGravity(Gravity.CENTER);
                  errorText.setPadding(0, (int) (12 * d), 0, (int) (24 * d));

                  Button retry = new Button(this);
                  retry.setText("Retry");
                  retry.setOnClickListener(v -> {
                      autoRetries = 0;
                      retryNow();
                  });

                  errorView.addView(title);
                  errorView.addView(errorText);
                  errorView.addView(retry);
                  root.addView(errorView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT));
              }

              private void onLoadFailed(String url, String reason) {
                  loadFailed = true;
                  if (url != null && url.startsWith("http")) {
                      failedUrl = url;
                  }
                  unblockImages();
                  if (splash != null) {
                      splashDone = true;
                      removeSplash();
                  }
                  errorText.setText("Check your connection and try again.\n(" + reason + ")");
                  errorView.setVisibility(View.VISIBLE);
                  ui.removeCallbacks(retryRunnable);
                  if (autoRetries < RETRY_DELAYS_MS.length) {
                      ui.postDelayed(retryRunnable, RETRY_DELAYS_MS[autoRetries++]);
                  }
              }

              private void retryNow() {
                  ui.removeCallbacks(retryRunnable);
                  errorText.setText("Retrying\u2026");
                  web.loadUrl(failedUrl);
              }

              private void hideError() {
                  ui.removeCallbacks(retryRunnable);
                  autoRetries = 0;
                  errorView.setVisibility(View.GONE);
              }

              private void registerNetworkCallback() {
                  if (netCallback != null) {
                      return;
                  }
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) {
                          return;
                      }
                      netCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              ui.post(() -> {
                                  if (errorView.getVisibility() == View.VISIBLE) {
                                      retryNow();
                                  }
                              });
                          }
                      };
                      cm.registerDefaultNetworkCallback(netCallback);
                  } catch (RuntimeException e) {
                      netCallback = null;
                  }
              }

              private void unregisterNetworkCallback() {
                  if (netCallback == null) {
                      return;
                  }
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm != null) {
                          cm.unregisterNetworkCallback(netCallback);
                      }
                  } catch (RuntimeException ignored) {
                  }
                  netCallback = null;
              }

              private void finishSplash() {
                  if (splashDone || splash == null) {
                      return;
                  }
                  splashDone = true;
                  splash.evaluateJavascript("launchDone()", null);
                  ui.postDelayed(this::removeSplash, 1500); // fallback if the exit event never arrives
              }

              private void removeSplash() {
                  if (splash == null) {
                      return;
                  }
                  root.removeView(splash);
                  splash.destroy();
                  splash = null;
              }

              private void acquireWifiLock() {
                  if (wifiLock != null) {
                      return;
                  }
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext()
                              .getSystemService(Context.WIFI_SERVICE);
                      if (wm == null) {
                          return;
                      }
                      int mode = Build.VERSION.SDK_INT >= 29
                              ? WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                              : WifiManager.WIFI_MODE_FULL_HIGH_PERF;
                      wifiLock = wm.createWifiLock(mode, "manbang");
                      wifiLock.setReferenceCounted(false);
                      wifiLock.acquire();
                  } catch (RuntimeException ignored) {
                      wifiLock = null;
                  }
              }

              private void releaseWifiLock() {
                  if (wifiLock != null) {
                      try {
                          if (wifiLock.isHeld()) {
                              wifiLock.release();
                          }
                      } catch (RuntimeException ignored) {
                      }
                      wifiLock = null;
                  }
              }

              private static boolean isInternal(Uri uri) {
                  String host = uri.getHost();
                  return "https".equals(uri.getScheme())
                          && host != null
                          && (host.equals(HOST) || host.endsWith("." + HOST));
              }

              private void hideCustomView() {
                  if (customView == null) {
                      return;
                  }
                  View v = customView;
                  WebChromeClient.CustomViewCallback cb = customViewCallback;
                  customView = null;
                  customViewCallback = null;
                  root.removeView(v);
                  web.setVisibility(View.VISIBLE);
                  if (cb != null) {
                      cb.onCustomViewHidden();
                  }
              }

              private void hideSystemUi() {
                  Window w = getWindow();
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.systemBars());
                          c.setSystemBarsBehavior(
                                  WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      w.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      hideCustomView();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  releaseWifiLock();
                  unregisterNetworkCallback();
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  acquireWifiLock();
                  registerNetworkCallback();
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacksAndMessages(null);
                  root.removeAllViews();
                  if (splash != null) {
                      splash.destroy();
                      splash = null;
                  }
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF
          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">만방</string>
          </resources>
          EOF
          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Manbang" parent="@android:style/Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF
          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF
          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
