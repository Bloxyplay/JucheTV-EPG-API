              var now = Date.now();
              if (cache && now - cacheAt < 600) return cache;
              var stamp = ++stampN, out = [], i;
              function add(el) { if (el.__tvs !== stamp) { el.__tvs = stamp; out.push(el); } }

              var list = document.querySelectorAll(SEL);
              for (i = 0; i < list.length; i++) if (isShown(list[i])) add(list[i]);

              // clickable <div>/<li>/... : the outermost element showing a pointer cursor
