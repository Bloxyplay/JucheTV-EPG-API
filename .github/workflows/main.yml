name: Restream to OK.ru

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Stream source type'
        required: true
        type: choice
        options:
          - 'Live M3U8'
          - 'Direct Video Download'
        default: 'Live M3U8'

      source_url:
        description: 'M3U8 URL or direct video download link'
        required: true
        type: string

      okru_stream_key:
        description: 'OK.ru Broadcast Key'
        required: true
        type: string

      quality:
        description: 'Output stream quality'
        required: true
        type: choice
        options:
          - '1080p'
          - '720p'
          - '480p'
        default: '720p'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare Source
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          echo "::add-mask::$SOURCE_URL"

          if [ "$SOURCE_TYPE" = "Direct Video Download" ]; then
            echo "Downloading video..."

            curl -fL --retry 5 --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 0 \
              -o video.mp4 "$SOURCE_URL"

            if [ ! -s video.mp4 ]; then
              echo "Download failed or file is empty."
              exit 1
            fi

            ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1 video.mp4

            echo "SOURCE_FILE=video.mp4" >> "$GITHUB_ENV"

          elif [ "$SOURCE_TYPE" = "Live M3U8" ]; then
            echo "Using live M3U8 source..."
            echo "SOURCE_FILE=$SOURCE_URL" >> "$GITHUB_ENV"

          else
            echo "Unsupported source type."
            exit 1
          fi

      - name: Stream to OK.ru
        env:
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          OKRU_KEY: ${{ inputs.okru_stream_key }}
          QUALITY: ${{ inputs.quality }}
        run: |
          echo "::add-mask::$OKRU_KEY"

          SERVER="rtmp://vsu.okcdn.ru/input/"
          OK_URL="${SERVER}${OKRU_KEY}"

          case "$QUALITY" in
            1080p)
              SCALE="1920:1080"
              VBR="6000k"
              BUFR="12000k"
              ABR="160k"
              ;;
            720p)
              SCALE="1280:720"
              VBR="4500k"
              BUFR="9000k"
              ABR="160k"
              ;;
            480p)
              SCALE="854:480"
              VBR="2000k"
              BUFR="4000k"
              ABR="128k"
              ;;
          esac

          echo "Starting OK.ru broadcast..."
          echo "Source type: $SOURCE_TYPE"
          echo "Quality: $QUALITY"

          if [ "$SOURCE_TYPE" = "Direct Video Download" ]; then

            ffmpeg -hide_banner -loglevel warning \
              -re \
              -i video.mp4 \
              -map 0:v:0 \
              -map 0:a:0? \
              -vf "scale=${SCALE}:force_original_aspect_ratio=decrease,pad=${SCALE}:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 \
              -preset veryfast \
              -b:v "$VBR" \
              -maxrate "$VBR" \
              -bufsize "$BUFR" \
              -g 60 \
              -keyint_min 60 \
              -sc_threshold 0 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a "$ABR" \
              -ac 2 \
              -ar 44100 \
              -f flv "$OK_URL"

          elif [ "$SOURCE_TYPE" = "Live M3U8" ]; then

            ffmpeg -hide_banner -loglevel warning \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 10 \
              -rw_timeout 30000000 \
              -user_agent "Mozilla/5.0" \
              -i "$SOURCE_URL" \
              -map 0:v:0 \
              -map 0:a:0? \
              -vf "scale=${SCALE}:force_original_aspect_ratio=decrease,pad=${SCALE}:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 \
              -preset veryfast \
              -b:v "$VBR" \
              -maxrate "$VBR" \
              -bufsize "$BUFR" \
              -g 60 \
              -keyint_min 60 \
              -sc_threshold 0 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a "$ABR" \
              -ac 2 \
              -ar 44100 \
              -f flv "$OK_URL"

          fi
