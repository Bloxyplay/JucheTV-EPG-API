          package xyz.manbang.app;

          import android.util.Log;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * One place for all app logging (system logcat + the on-screen overlay).
           * Every message is scrubbed here, so no call site can leak the site name:
           * URLs lose their host and query (only the path is kept) and the site name itself is masked.
           */
          final class AppLog {

              static final class Entry {
                  final long time;
                  final char level;
                  final String tag;
                  final String msg;

                  Entry(long time, char level, String tag, String msg) {
                      this.time = time;
                      this.level = level;
                      this.tag = tag;
                      this.msg = msg;
                  }
              }

              interface Listener {
                  void onLog();
              }

              private static final String TAG = "Manbang";
              private static final int MAX_ENTRIES = 300;
              private static final int MAX_PATH = 46;

              // scheme://host[/path][?query][#fragment]  ->  keeps only /path
              private static final Pattern URL = Pattern.compile(
                      "(?i)\\b[a-z][a-z0-9+.\\-]*://[^/\\s\"'<>()]*([^\\s\"'<>()?#]*)(?:[?#][^\\s\"'<>()]*)?");
              private static final Pattern SITE = Pattern.compile(
                      "(?i)(?:[a-z0-9-]+\\.)*" + Pattern.quote(Site.HOST));

              private static final ArrayDeque<Entry> BUFFER = new ArrayDeque<>();
              private static volatile Listener listener;

              private AppLog() {
              }

              static void setListener(Listener l) {
                  listener = l;
              }

              static void d(String tag, String msg) {
                  add('D', tag, msg);
              }

              static void i(String tag, String msg) {
                  add('I', tag, msg);
              }

              static void w(String tag, String msg) {
                  add('W', tag, msg);
              }

              static void e(String tag, String msg) {
                  add('E', tag, msg);
              }

              /** Last n entries, oldest first. */
              static List<Entry> last(int n) {
                  synchronized (BUFFER) {
                      List<Entry> all = new ArrayList<>(BUFFER);
                      int from = Math.max(0, all.size() - n);
                      return new ArrayList<>(all.subList(from, all.size()));
                  }
              }

              static String redact(String raw) {
                  if (raw == null) {
                      return "";
                  }
                  Matcher m = URL.matcher(raw);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String path = m.group(1);
                      if (path == null || path.isEmpty()) {
                          path = "/";
                      }
                      m.appendReplacement(sb, Matcher.quoteReplacement(shorten(path)));
                  }
                  m.appendTail(sb);
                  String out = SITE.matcher(sb.toString()).replaceAll("\u2022\u2022\u2022");
                  return out.length() > 160 ? out.substring(0, 160) + "\u2026" : out;
              }

              private static String shorten(String path) {
                  if (path.length() <= MAX_PATH) {
                      return path;
                  }
                  return path.substring(0, 18) + "\u2026" + path.substring(path.length() - 26);
              }

              private static void add(char level, String tag, String raw) {
                  String msg = redact(raw);
                  String logTag = TAG + "/" + tag;
                  switch (level) {
                      case 'E':
                          Log.e(logTag, msg);
                          break;
                      case 'W':
                          Log.w(logTag, msg);
                          break;
                      case 'I':
                          Log.i(logTag, msg);
                          break;
                      default:
                          Log.d(logTag, msg);
                          break;
                  }
                  synchronized (BUFFER) {
                      BUFFER.addLast(new Entry(System.currentTimeMillis(), level, tag, msg));
                      while (BUFFER.size() > MAX_ENTRIES) {
                          BUFFER.removeFirst();
                      }
                  }
                  Listener l = listener;
                  if (l != null) {
                      l.onLog();
                  }
              }
          }
