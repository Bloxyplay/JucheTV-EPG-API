name: Stream to YouTube

on:
  workflow_dispatch:
    inputs:
      youtube_key:
        description: 'YouTube stream key'
        required: true
        type: string
      m3u8_url:
        description: 'M3U8 stream URL'
        required: true
        type: string
      quality:
        description: 'Stream quality'
        required: true
        type: choice
        options:
          - '1080p'
          - '720p'
          - '480p'
        default: '720p'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream to YouTube
        run: |
          case "${{ inputs.quality }}" in
            1080p) SCALE="1920:1080"; VBR="6000k"; ABR="192k"; ;;
            720p)  SCALE="1280:720";  VBR="4500k"; ABR="160k"; ;;
            480p)  SCALE="854:480";   VBR="2500k"; ABR="128k"; ;;
          esac

          STREAM_URL="rtmp://a.rtmp.youtube.com/live2/${{ inputs.youtube_key }}"
          INPUT="${{ inputs.m3u8_url }}"

          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "=== Stream attempt #${attempt} ==="

            ffmpeg -hide_banner -loglevel warning \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 30000000 \
              -user_agent "Mozilla/5.0" \
              -i "$INPUT" \
              -re \
              -vf "scale=${SCALE}:force_original_aspect_ratio=decrease,pad=${SCALE}:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset veryfast -b:v "${VBR}" -maxrate "${VBR}" -bufsize 2x \
              -g 60 -keyint_min 60 -pix_fmt yuv420p \
              -c:a aac -b:a "${ABR}" -ac 2 -ar 44100 \
              -f flv "$STREAM_URL" \
              && break

            echo "Stream dropped. Reconnecting in 5 seconds..."
            sleep 5
          done
