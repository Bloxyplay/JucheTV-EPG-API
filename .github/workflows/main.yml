      - name: Build
        working-directory: ManbangWebView
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: manbang-apk
          path: ManbangWebView/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ManbangWebView/app/build/outputs/apk/debug/app-debug.apk manbang.apk
          gh release delete latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest manbang.apk --repo "$GITHUB_REPOSITORY" --title "latest" --notes "Debug build ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
