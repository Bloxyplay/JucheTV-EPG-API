name: Stream to OK.ru

on:
  workflow_dispatch:
    inputs:
      m3u8_url:
        description: 'M3U8 stream URL'
        required: true
        type: string

      okru_stream_key:
        description: 'OK.ru Stream Key / RTMP URL'
        required: true
        type: string

      quality:
        description: 'Stream quality'
        required: true
        type: choice
        options:
          - '1080p'
          - '720p'
          - '480p'
        default: '720p'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream to OK.ru
        run: |
          echo "::add-mask::${{ inputs.okru_stream_key }}"

          case "${{ inputs.quality }}" in
            1080p) SCALE="1920:1080"; VBR="6000k"; BUFR="12000k"; ABR="160k" ;;
            720p)  SCALE="1280:720";  VBR="4500k"; BUFR="9000k";  ABR="160k" ;;
            480p)  SCALE="854:480";   VBR="2000k"; BUFR="4000k";  ABR="128k" ;;
          esac

          OK_URL="${{ inputs.okru_stream_key }}"
          INPUT="${{ inputs.m3u8_url }}"

          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "=== Stream attempt #${attempt} ==="

            ffmpeg -hide_banner -loglevel warning \
              -re \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 \
              -reconnect_delay_max 10 -rw_timeout 30000000 \
              -user_agent "Mozilla/5.0" \
              -i "$INPUT" \
              -vf "scale=${SCALE}:force_original_aspect_ratio=decrease,pad=${SCALE}:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 -preset veryfast -b:v "${VBR}" -maxrate "${VBR}" -bufsize "${BUFR}" \
              -g 60 -keyint_min 60 -sc_threshold 0 -pix_fmt yuv420p \
              -c:a aac -b:a "${ABR}" -ac 2 -ar 44100 \
              -f flv "$OK_URL" \
              && break

            echo "Stream dropped. Reconnecting in 5 seconds..."
            sleep 5
          done
