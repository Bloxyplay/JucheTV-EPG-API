<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTV Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; font-size: 1.4rem; color: #ff4444; }
        .subtitle { color: #888; margin-bottom: 15px; font-size: 0.8rem; }
        .server-select {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }
        .server-btn {
            padding: 8px 16px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .server-btn:hover { border-color: #ff4444; color: #fff; }
        .server-btn.active { background: #ff4444; border-color: #ff4444; color: #fff; }
        #video-container {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid #222;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            z-index: 20;
            transition: opacity 0.3s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 44px; height: 44px;
            border: 3px solid #333;
            border-top-color: #ff4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 0.9rem; color: #aaa; text-align: center; max-width: 80%; }
        .status.error { color: #ff4444; }
        .controls-bar {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #1a1a1a;
            color: #ccc;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .ctrl-btn:hover { background: #2a2a2a; }
        .ctrl-btn.primary { background: #ff4444; color: #fff; }
        .ctrl-btn.primary:hover { background: #cc3333; }
        .info-bar {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 0.75rem;
            color: #666;
        }
        .info-bar span { display: flex; align-items: center; gap: 5px; }
        .info-bar .live { color: #4caf50; }
        .info-bar .live::before {
            content: "";
            display: inline-block;
            width: 8px; height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .log {
            margin-top: 15px;
            width: 100%;
            max-width: 1100px;
            max-height: 180px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #888;
        }
        .log .ok { color: #4caf50; }
        .log .err { color: #ff4444; }
        .log .info { color: #2196f3; }
        .log .warn { color: #ff9800; }
    </style>
</head>
<body>
    <h1>🇰🇵 KCTV Stream Player</h1>
    <p class="subtitle">Korean Central Television — Live from Pyongyang</p>

    <div class="server-select" id="servers"></div>

    <div id="video-container">
        <div class="overlay" id="overlay">
            <div class="spinner" id="spinner"></div>
            <div class="status" id="status">Select a server and click Play</div>
        </div>
        <video id="video" controls crossorigin="anonymous" playsinline></video>
    </div>

    <div class="controls-bar">
        <button class="ctrl-btn primary" onclick="startStream()">▶ Play</button>
        <button class="ctrl-btn" onclick="stopStream()">⏹ Stop</button>
        <button class="ctrl-btn" onclick="refreshSession()">🔄 Refresh</button>
        <button class="ctrl-btn" onclick="clearLog()">🗑 Clear Log</button>
    </div>

    <div class="info-bar">
        <span id="info-server">Server: —</span>
        <span id="info-quality">Quality: —</span>
        <span id="info-buffer">Buffer: —</span>
        <span id="info-latency">Latency: —</span>
        <span id="info-status">Status: <span class="live">● Idle</span></span>
    </div>

    <div class="log" id="log"></div>

<script>
const SERVERS = [
    { name: "Canada (MTR)", baseUrl: "https://edge-mtr.koryo.tv", region: "MTR" },
    { name: "Belarus (MSK)", baseUrl: "https://edge-msk.koryo.tv", region: "MSK" },
    { name: "Macau (MCU)", baseUrl: "https://edge-mcu.koryo.tv", region: "MCU" },
    { name: "Japan (OSK)", baseUrl: "https://edge-osk.koryo.tv", region: "OSK" },
    { name: "Russia (VVO)", baseUrl: "https://edge-vvo.koryo.tv", region: "VVO" }
];

let selectedServer = null;
let hls = null;
let isPlaying = false;

function log(msg, type = "info") {
    const el = document.getElementById("log");
    const line = document.createElement("div");
    line.className = type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById("log").innerHTML = ""; }

function renderServers() {
    const container = document.getElementById("servers");
    container.innerHTML = "";
    SERVERS.forEach((srv, i) => {
        const btn = document.createElement("button");
        btn.className = "server-btn";
        btn.textContent = srv.name;
        btn.onclick = () => selectServer(i);
        container.appendChild(btn);
    });
}

function selectServer(idx) {
    selectedServer = SERVERS[idx];
    document.querySelectorAll(".server-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
    document.getElementById("info-server").textContent = `Server: ${selectedServer.region}`;
    log(`Selected: ${selectedServer.name}`, "ok");
}

function showOverlay(show, text = "", isError = false) {
    const ov = document.getElementById("overlay");
    const st = document.getElementById("status");
    if (show) {
        ov.classList.remove("hidden");
        st.textContent = text;
        st.className = "status" + (isError ? " error" : "");
    } else {
        ov.classList.add("hidden");
    }
}

function updateInfo(quality, buffer, latency) {
    if (quality) document.getElementById("info-quality").textContent = `Quality: ${quality}`;
    if (buffer !== undefined) document.getElementById("info-buffer").textContent = `Buffer: ${buffer.toFixed(1)}s`;
    if (latency !== undefined) document.getElementById("info-latency").textContent = `Latency: ${latency.toFixed(0)}ms`;
}

function setStatus(status, live = false) {
    const el = document.getElementById("info-status");
    el.innerHTML = live ? `Status: <span class="live">● ${status}</span>` : `Status: ${status}`;
}

async function createSession() {
    if (!selectedServer) { log("No server selected!", "err"); return false; }
    showOverlay(true, "Creating session...");
    log(`Session → ${selectedServer.region}...`);

    try {
        const target = `${selectedServer.baseUrl}/session/anon?quality=1080p`;
        const resp = await fetch(`/api/koryo-proxy?target=${encodeURIComponent(target)}`, {
            method: "GET",
            headers: { "Accept": "application/json" },
            credentials: "include"
        });
        if (!resp.ok) throw new Error(await resp.text().catch(() => String(resp.status)));
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || "Session failed");
        log(`Session OK | Quality: ${data.quality || "1080p"}`, "ok");
        return true;
    } catch (e) {
        log(`Session error: ${e.message}`, "err");
        showOverlay(true, `Session failed: ${e.message}`, true);
        return false;
    }
}

async function bootstrapM3U8() {
    showOverlay(true, "Fetching playlist...");
    log("Bootstrapping M3U8...");
    try {
        const target = `${selectedServer.baseUrl}/kctv/live/${crypto.randomUUID()}.m3u8`;
        const resp = await fetch(`/api/koryo-proxy?target=${encodeURIComponent(target)}`, {
            redirect: "follow", cache: "no-store", credentials: "include"
        });
        if (!resp.ok) throw new Error(`Bootstrap ${resp.status}`);
        const finalUrl = resp.headers.get('X-Final-Url') || target;
        log(`Playlist: ${finalUrl.split('/').pop()}`, "ok");
        // hand hls.js the proxied URL, not the raw koryo.tv one
        return `/api/koryo-proxy?target=${encodeURIComponent(finalUrl)}`;
    } catch (e) {
        log(`Bootstrap error: ${e.message}`, "err");
        showOverlay(true, `Playlist error: ${e.message}`, true);
        return null;
    }
}

async function startStream() {
    if (isPlaying) { log("Already playing", "warn"); return; }
    if (!selectedServer) { log("Select a server first", "err"); return; }

    if (!await createSession()) return;
    await new Promise(r => setTimeout(r, 300));
    const m3u8Url = await bootstrapM3U8();
    if (!m3u8Url) return;

    const video = document.getElementById("video");
    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
        hls = new Hls({
            debug: false,
            enableWorker: true,
            xhrSetup: (xhr) => { xhr.withCredentials = true; }
        });

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            log(`Manifest: ${data.levels.length} level(s)`, "ok");
            const q = data.levels[data.levels.length - 1];
            updateInfo(q ? `${q.width}x${q.height}` : "1080p", 0, 0);
            showOverlay(false);
            isPlaying = true;
            setStatus("LIVE", true);
            video.play().catch(e => log(`Autoplay blocked: ${e.message}`, "warn"));
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
            const lvl = hls.levels[data.level];
            if (lvl) updateInfo(`${lvl.width}x${lvl.height}`);
        });

        hls.on(Hls.Events.BUFFER_APPENDED, () => {
            if (hls) {
                const buf = hls.mainForwardBufferInfo || { len: 0 };
                updateInfo(null, buf.len, hls.latency || 0);
            }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                log(`Fatal: ${data.type} — ${data.details}`, "err");
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    log("Recovering network...", "warn"); hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    log("Recovering media...", "warn"); hls.recoverMediaError();
                } else {
                    stopStream();
                    showOverlay(true, "Stream error — refresh to retry", true);
                }
            } else {
                log(`Warn: ${data.details}`, "warn");
            }
        });

        hls.loadSource(m3u8Url);
        hls.attachMedia(video);

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = m3u8Url;
        video.addEventListener("loadedmetadata", () => {
            showOverlay(false);
            isPlaying = true;
            setStatus("LIVE", true);
            video.play();
        });
        video.addEventListener("error", () => log(`Video error`, "err"));
    } else {
        log("HLS not supported", "err");
        showOverlay(true, "HLS not supported — use Chrome/Firefox/Safari", true);
    }
}

function stopStream() {
    const video = document.getElementById("video");
    video.pause(); video.src = "";
    if (hls) { hls.destroy(); hls = null; }
    isPlaying = false;
    setStatus("Stopped");
    showOverlay(true, "Stream stopped");
    log("Stopped", "info");
}

async function refreshSession() {
    log("Refreshing...", "info");
    stopStream();
    await new Promise(r => setTimeout(r, 500));
    await startStream();
}

renderServers();
selectServer(0);
log("KCTV hls.js Player ready. Select server → Play.", "ok");
</script>
</body>
</html>
